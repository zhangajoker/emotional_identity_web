services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - emotion_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s



  backend:
    build: ./backend
    container_name: emotion_backend_container
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/model:/app/model
    depends_on:
      db:
        condition: service_healthy
    # 注入 Docker 专属的环境变量
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: emotion_db
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-情绪感知空间}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:5173}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:7b}
      ENABLE_AI_CHAT: ${ENABLE_AI_CHAT:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s
    networks:
      - emotion_net


  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_AI_CHAT: ${VITE_ENABLE_AI_CHAT:-true}
    container_name: emotion_frontend_container
    restart: always
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - emotion_net

volumes:
  mysql_data:

networks:
  emotion_net:
    driver: bridge
